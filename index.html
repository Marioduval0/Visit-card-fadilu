<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fadilu CHABI MARE — Carte de visite</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--b:#1F4E9C;--bd:#142F63;--bg:#E9EEF6;--w:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--w);padding:24px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:26px;-webkit-font-smoothing:antialiased}
.card{position:relative;width:100%;max-width:410px;border-radius:22px;overflow:hidden;box-shadow:0 2px 6px rgba(20,47,99,.12),0 22px 44px rgba(20,47,99,.26)}
.front{background:linear-gradient(165deg,#2459AD 0%,#1A4287 55%,#142F63 100%)}
.head{position:relative;background:var(--w);height:236px;border-radius:0 0 50% 50%/0 0 70px 70px;box-shadow:0 12px 22px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.ph{position:relative;width:180px;height:180px}
.ph img{position:absolute;inset:20px;width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid var(--bd);box-shadow:0 6px 16px rgba(20,47,99,.3)}
.ph svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--bd);stroke-linecap:round}
.drip{position:absolute;height:13px;border-radius:13px;transform:rotate(-40deg)}
.dot{position:absolute;width:14px;height:14px;border-radius:50%}
.body{position:relative;padding:26px 22px 26px}
h1{font-size:23px;font-weight:700;letter-spacing:.2px;text-align:center}
.roles{display:flex;flex-direction:column;gap:5px;margin:10px 0 0;text-align:center}
.roles p{font-size:12.5px;line-height:1.4;font-weight:500;color:rgba(255,255,255,.85)}
.roles p:first-child{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.roles b{font-weight:700;color:#fff}
.sep{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);margin:18px 0 16px}
ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:9px}
li a{display:flex;align-items:center;gap:13px;color:var(--w);text-decoration:none;font-size:13.5px;font-weight:500;padding:9px 12px 9px 9px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);transition:background .2s}
li a:active,li a:hover{background:rgba(255,255,255,.16)}
li a:focus-visible,.save:focus-visible{outline:2px solid var(--w);outline-offset:3px}
.ic{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:18px;height:18px;fill:none;stroke:var(--w);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch{width:16px;height:16px;fill:none;stroke:rgba(255,255,255,.55);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.save{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;background:var(--w);color:var(--bd);font:700 14px Montserrat,system-ui,sans-serif;padding:15px;border-radius:14px;text-decoration:none;box-shadow:0 8px 18px rgba(0,0,0,.22)}
.save svg{width:18px;height:18px;fill:none;stroke:var(--bd);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.save:active{transform:scale(.98)}
.back{background:var(--w);height:250px;display:flex;align-items:center;justify-content:center}
.qrw{position:relative;width:200px;height:200px;border-radius:50%;background:linear-gradient(160deg,#2459AD,#142F63);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 18px rgba(0,0,0,.3)}
.qrb{background:#fff;padding:8px;border-radius:12px;line-height:0;width:134px;height:134px}
.qrb img,.qrb canvas{width:100%!important;height:100%!important}
.rings{position:absolute;width:250px;height:250px;fill:none;stroke:var(--bd);stroke-linecap:round}
.cap{color:var(--bd);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin-top:-10px}
@media(prefers-reduced-motion:no-preference){.card{animation:in .5s ease both}.back{animation-delay:.12s}}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
</style>
</head>
